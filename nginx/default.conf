server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Extend nginx's default MIME map (do not replace it, or every asset
  # ships as application/octet-stream and the browser downloads the shell).
  include /etc/nginx/mime.types;
  types {
    application/wasm wasm;
  }

  gzip on;
  gzip_types application/javascript application/json text/css application/wasm;

  # Never cache the shell or the runtime config.
  location = /index.html {
    include /etc/nginx/snippets/isolation.conf;
    add_header Cache-Control "no-cache" always;
  }
  location = /env.js {
    include /etc/nginx/snippets/isolation.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Long-cache immutable, content-hashed assets and vendored model/runtime.
  location /assets/ {
    include /etc/nginx/snippets/isolation.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /models/ {
    include /etc/nginx/snippets/isolation.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /ort/ {
    include /etc/nginx/snippets/isolation.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SPA fallback.
  location / {
    include /etc/nginx/snippets/isolation.conf;
    try_files $uri /index.html;
  }
}
